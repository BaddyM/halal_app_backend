#This is the production workflow

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    container_name: halal-backend
    restart: always
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - PAYMENT_KEYS_ENCRYPTION_KEY=${PAYMENT_KEYS_ENCRYPTION_KEY:-}
      - PAYMENT_CONFIG_ENCRYPTION_KEY=${PAYMENT_CONFIG_ENCRYPTION_KEY:-}
      - PESAPAL_IPN_URL=${PESAPAL_IPN_URL:-https://admin.halalconnect.space/api/public/payments/pesapal/ipn}
      - MODE=Prod
      - CORS_ORIGINS=https://halalconnect.space,https://www.halalconnect.space,https://admin.halalconnect.space
      - API_BASE_URL=${API_BASE_URL:-https://halalconnect.space/api}
      - REDIS_URL=redis://redis:6379
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_SECURE=false
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_FROM_NAME=Halalconnect
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-Halal Connect <team@halalconnect.space>}
      # Firebase Cloud Messaging. The key is mounted (below), never baked into
      # the image. Alternative for managed hosts: set FIREBASE_SERVICE_ACCOUNT
      # to the JSON inline and drop the volume.
      - FIREBASE_SERVICE_ACCOUNT_PATH=./config/halal-connect-6504d.json
    volumes:
      - /root/halal/halal-assets:/app/uploads
      - /root/halal/halal-private-uploads:/app/private-uploads
      - /root/halal/assets:/app/src/assets
      - /root/halal/config:/app/config:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - halal-network

  redis:
    image: redis:latest
    container_name: halal-redis
    restart: always
    # Bind to loopback only: reachable from the server's localhost, not externally
    ports:
      - "127.0.0.1:6378:6379"
    networks:
      - halal-network

  mysql:
    image: mysql:latest
    container_name: halal-mysql
    restart: always
    # Bind to loopback only: reachable from the server's localhost, not externally
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=halal_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
    networks:
      - halal-network

networks:
  halal-network:
    name: "halal-network"
    driver: bridge

volumes:
  mysql_data: