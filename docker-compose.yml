#This is the production workflow

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    command: sh -c "npx prisma db push && npm run start:prod"
    container_name: halal-backend
    restart: always
    ports:
      - "3003:3000"
    environment:
      - DATABASE_URL=mysql://root:Sextape,123@mysql:3306/halal_db
      - PORT=3000
      - SYSTEM_SECRET=MYAUTHSECRETISVERYSTRONG
      - MODE=Prod
      - REDIS_URL=redis://redis:6379
      - EMAIL_USER=
      - EMAIL_PASS=
    volumes:
      - /root/halal/halal-assets:/app/uploads
      - /root/halal/assets:/app/src/assets
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - halal-network

  redis:
    image: redis:latest
    container_name: halal-redis
    restart: always
    # Bind to loopback only: reachable from the server's localhost, not externally
    ports:
      - "127.0.0.1:6378:6379"
    networks:
      - halal-network

  mysql:
    image: mysql:latest
    container_name: halal-mysql
    restart: always
    # Bind to loopback only: reachable from the server's localhost, not externally
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Sextape,123
      - MYSQL_DATABASE=halal_db
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pSextape,123"]
    networks:
      - halal-network

networks:
  halal-network:
    name: "halal-network"
    driver: bridge

volumes:
  mysql_data: